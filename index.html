<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quyết Định Yes/No</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="title">Bạn đang phân vân?</h1>
    <p class="subtitle">Nhấn nút bên dưới để nhận câu trả lời</p>

    <!-- Nút bấm 3D -->
    <div class="button-wrapper">
      <button id="decisionBtn" class="btn-3d">
        <span class="btn-top">
          <span class="btn-text">BẮT ĐẦU</span>
        </span>
      </button>
    </div>

    <!-- Khung hiển thị kết quả -->
    <div id="resultBox" class="result-box hidden">
      <span id="resultText">YES</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
